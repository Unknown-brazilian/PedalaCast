<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PedalaCast: ride videos with live telemetry</title>
<meta name="description" content="Android app that records bike rides and streams live to YouTube with a speed, map, distance and elevation overlay burned into the video.">
<link rel="icon" href="assets/icon.png">
<style>
:root{--bg:#1F2430;--surface:#2A3040;--accent:#FF7A2F;--live:#FF4D3D;--text:#fff;--muted:#B4B8C2;--warn:#FFC857}
@media (prefers-color-scheme: light){:root{--bg:#1F2430}} /* brand is dark-first */
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent)}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.15rem;text-decoration:none;color:var(--text)}
.brand img{width:36px;height:36px;border-radius:9px}
.lang{display:flex;gap:6px}
.lang button{background:var(--surface);color:var(--text);border:1px solid transparent;border-radius:8px;padding:6px 10px;font:inherit;font-size:.85rem;cursor:pointer}
.lang button[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
.hero{display:grid;grid-template-columns:1fr;gap:28px;padding:28px 0 40px;align-items:center}
@media(min-width:860px){.hero{grid-template-columns:1fr 1.2fr}}
h1{font-size:clamp(1.9rem,5vw,3rem);line-height:1.15;margin:0 0 14px}
h1 em{font-style:normal;color:var(--accent)}
.lead{color:var(--muted);font-size:1.1rem;margin:0 0 22px}
.btn{display:inline-block;background:var(--accent);color:var(--bg);font-weight:700;text-decoration:none;padding:14px 22px;border-radius:999px;margin:0 8px 8px 0}
.btn.alt{background:var(--surface);color:var(--text)}
.shot{border-radius:14px;width:100%;height:auto;display:block;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.cap{color:var(--muted);font-size:.85rem;margin:8px 2px 0}
section{padding:36px 0;border-top:1px solid rgba(255,255,255,.08)}
h2{font-size:1.6rem;margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.card{background:var(--surface);border-radius:14px;padding:18px}
.card h3{margin:0 0 6px;font-size:1.05rem}
.card p{margin:0;color:var(--muted)}
.steps{counter-reset:s;display:grid;gap:14px;padding:0;list-style:none}
.steps li{counter-increment:s;background:var(--surface);border-radius:14px;padding:16px 16px 16px 60px;position:relative}
.steps li::before{content:counter(s);position:absolute;left:16px;top:14px;width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--bg);font-weight:700;display:grid;place-items:center}
.phones{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.phones figure{margin:0}
.phones img{width:100%;height:auto;border-radius:14px;display:block}
.phones figcaption{color:var(--muted);font-size:.85rem;margin-top:6px;text-align:center}
.note{border-left:4px solid var(--warn);background:var(--surface);padding:12px 16px;border-radius:8px;color:var(--muted)}
.note b{color:var(--warn)}
.road{display:grid;gap:8px;padding:0;list-style:none}
.road li{background:var(--surface);border-radius:10px;padding:10px 14px}
.tag{font-size:.75rem;border-radius:999px;padding:2px 9px;margin-right:8px;font-weight:700}
.tag.ok{background:var(--accent);color:var(--bg)}
.tag.soon{background:transparent;border:1px solid var(--muted);color:var(--muted)}
footer{padding:30px 0 50px;color:var(--muted);font-size:.9rem;border-top:1px solid rgba(255,255,255,.08)}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <a class="brand" href="#"><img src="assets/icon.png" alt=""><span>PedalaCast</span></a>
  <div class="lang" role="group" aria-label="Language">
    <button data-l="en">EN</button><button data-l="es">ES</button><button data-l="fr">FR</button><button data-l="pt">PT</button>
  </div>
</header>

<div class="hero">
  <div>
    <h1 data-i="h1"></h1>
    <p class="lead" data-i="lead"></p>
    <a class="btn" href="https://github.com/Unknown-brazilian/PedalaCast/releases/latest" data-i="dl"></a>
    <a class="btn alt" href="https://github.com/Unknown-brazilian/PedalaCast" data-i="src"></a>
    <p class="cap" data-i="req"></p>
  </div>
  <div>
    <img class="shot" src="assets/overlay.jpg" alt="Speedometer, distance, climb, elevation profile, grade badge and mini-map over a video frame">
    <p class="cap" data-i="overlayCap"></p>
  </div>
</div>

<section id="what">
  <h2 data-i="whatH"></h2>
  <p data-i="whatP"></p>
  <div class="grid">
    <div class="card"><h3 data-i="f1h"></h3><p data-i="f1p"></p></div>
    <div class="card"><h3 data-i="f2h"></h3><p data-i="f2p"></p></div>
    <div class="card"><h3 data-i="f3h"></h3><p data-i="f3p"></p></div>
    <div class="card"><h3 data-i="f4h"></h3><p data-i="f4p"></p></div>
    <div class="card"><h3 data-i="f5h"></h3><p data-i="f5p"></p></div>
    <div class="card"><h3 data-i="f6h"></h3><p data-i="f6p"></p></div>
  </div>
</section>

<section id="how">
  <h2 data-i="howH"></h2>
  <ol class="steps">
    <li data-i="s1"></li><li data-i="s2"></li><li data-i="s3"></li><li data-i="s4"></li>
  </ol>
  <p class="cap" data-i="howNote"></p>
</section>

<section id="shots">
  <h2 data-i="shotsH"></h2>
  <div class="phones">
    <figure><img src="assets/01_home.jpg" alt="" loading="lazy"><figcaption data-i="c1"></figcaption></figure>
    <figure><img src="assets/02_live_setup.jpg" alt="" loading="lazy"><figcaption data-i="c2"></figcaption></figure>
    <figure><img src="assets/04_layout.jpg" alt="" loading="lazy"><figcaption data-i="c3"></figcaption></figure>
    <figure><img src="assets/03_settings.jpg" alt="" loading="lazy"><figcaption data-i="c4"></figcaption></figure>
    <figure><img src="assets/05_about.jpg" alt="" loading="lazy"><figcaption data-i="c5"></figcaption></figure>
  </div>
  <div class="grid" style="margin-top:18px">
    <div><img class="shot" src="assets/recording.jpg" alt="" loading="lazy"><p class="cap" data-i="c6"></p></div>
    <div><img class="shot" src="assets/frame.jpg" alt="" loading="lazy"><p class="cap" data-i="c7"></p></div>
  </div>
  <p class="cap" data-i="shotsNote"></p>
</section>

<section id="tips">
  <h2 data-i="tipsH"></h2>
  <div class="note"><b data-i="tipsT"></b> <span data-i="tipsP"></span></div>
</section>

<section id="road">
  <h2 data-i="roadH"></h2>
  <ul class="road">
    <li><span class="tag ok" data-i="done"></span><span data-i="r1"></span></li>
    <li><span class="tag ok" data-i="done"></span><span data-i="r2"></span></li>
    <li><span class="tag soon" data-i="soon"></span><span data-i="r3"></span></li>
    <li><span class="tag soon" data-i="soon"></span><span data-i="r4"></span></li>
    <li><span class="tag soon" data-i="soon"></span><span data-i="r5"></span></li>
  </ul>
</section>

<footer>
  <p data-i="foot1"></p>
  <p><a href="https://github.com/Unknown-brazilian/PedalaCast/issues" data-i="issues"></a> · <a href="https://github.com/Unknown-brazilian/PedalaCast" data-i="srcLink"></a></p>
</footer>
</div>

const LS='en es fr pt'.split(' ');
function pick(){try{const s=localStorage.getItem('lang');if(s&&T[s])return s}catch(e){}
  const n=(navigator.language||'en').slice(0,2).toLowerCase();return T[n]?n:'en'}
function apply(l){
  document.documentElement.lang=l;
  document.querySelectorAll('[data-i]').forEach(el=>{el.innerHTML=T[l][el.dataset.i]||''});
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===l));
  document.title='PedalaCast: '+T[l].lead.split('.')[0];
  try{localStorage.setItem('lang',l)}catch(e){}
}
